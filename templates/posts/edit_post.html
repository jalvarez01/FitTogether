{% extends "base.html" %}
{% block content %}
<div class="container py-4" style="max-width: 720px;">
  <h3 class="mb-3">Edit Post</h3>

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Message</label>
          {{ form.content }}
        </div>

        <div class="mb-3">
          <label class="form-label">Photo</label>
          {{ form.image }}
        </div>

        {% if post.image %}
          <div class="mb-3">
            <img src="{{ post.image.url }}" class="img-fluid rounded" style="max-height:280px;">
          </div>
          <div class="form-check mb-3">
            {{ form.remove_image }}
            <label class="form-check-label" for="{{ form.remove_image.id_for_label }}">
              Remove current image
            </label>
          </div>
        {% endif %}

        <div class="d-flex gap-2">
          <button class="btn btn-dark" type="submit">Save</button>
          <a class="btn btn-outline-secondary" href="javascript:history.back()">Cancel</a>
        </div>
      </form>

      <p class="text-muted mt-3 mb-0" style="font-size:.9rem;">
        You can edit your post only within 24 hours after creation.
      </p>
    </div>
  </div>
</div>
{% endblock %}
